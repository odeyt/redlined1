openapi: 3.0.3
info:
  title: Redlined1 API
  version: "1.0.0"
  description: |
    Redlined1 API v1.

    Only the endpoints documented here exist. This file is the contract; it is
    not generated from wishes.

    **Authentication** is an organization-scoped API key sent as a bearer
    token. The key determines which organization and which shops the request
    can reach — no request field can change that. To act on a different tenant,
    use a different key.

    **Delivery of side effects** (domain events) is at-least-once. Anything you
    build on top of Redlined1 events must be idempotent.

servers:
  - url: https://www.redlined1.com
    description: Production
  - url: https://staging.redlined1.com
    description: Staging (behind deployment protection)

security:
  - ApiKeyAuth: []

tags:
  - name: Customers
  - name: Vehicles

paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      description: |
        Customers visible to this key, ordered by name then id so paging is
        stable when two customers share a name. Archived customers are omitted.
      operationId: listCustomers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: Capped at 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              example:
                data:
                  - id: C-1734567890123
                    name: Somchai Vong
                    type: Individual
                    phone: "+856 20 5555 1234"
                    email: somchai@example.la
                    address: Sikhottabong, Vientiane
                    tags: [fleet]
                    follow_up: ""
                    archived: false
                meta:
                  request_id: 4f1c2f0e-1f3a-4a9b-9a0e-2b6c1d5e7a10
                  page: 1
                  page_size: 25
                  total: 1
                  has_more: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

    post:
      tags: [Customers]
      summary: Create a customer
      description: |
        Creates a customer in the shop this key is scoped to.

        A key covering several shops cannot create — there would be no
        unambiguous target — and returns `SHOP_NOT_ACCESSIBLE`. Use a
        shop-scoped key.

        Send `Idempotency-Key` to make retries safe. The same key with the same
        body replays the original response; the same key with a different body
        returns `IDEMPOTENCY_CONFLICT`.
      operationId: createCustomer
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
            example:
              name: Somchai Vong
              type: Individual
              phone: "+856 20 5555 1234"
              email: somchai@example.la
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get one customer
      description: |
        A customer belonging to another tenant returns **404**, not 403 —
        confirming existence would let a caller enumerate ids.
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      description: |
        Vehicles visible to this key, ordered by label then id so paging is
        stable when two vehicles share a label — many do.

        `search` matches VIN, plate, label, make or model, case-insensitively.
      operationId: listVehicles
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: Capped at 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          description: Substring match on VIN, plate, label, make or model.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of vehicles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

    post:
      tags: [Vehicles]
      summary: Create a vehicle
      description: |
        Creates a vehicle in the shop this key is scoped to.

        `label` is the only required field. A vehicle may have **no VIN** and
        **no customer** — both are real states in Redlined1, used for classic
        and import work and for vehicles booked in before an owner record
        exists.

        If `customerId` is supplied it must belong to a shop this key can
        reach. One that does not returns **404**, the same as a customer that
        does not exist, and no vehicle is created.

        VINs are trimmed and upper-cased. They are **not** required to be 17
        characters and are **not** unique — Redlined1 holds vehicles with 16-
        and 22-character VINs, and duplicates exist within a single shop.
      operationId: createVehicle
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
            example:
              label: Hilux — Somchai
              vin: MR0FZ29G501234567
              plate: KM-4821
              make: Toyota
              model: Hilux
              year: "2019"
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — the supplied `customerId` is not reachable by this key.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get one vehicle
      description: A vehicle belonging to another tenant returns **404**, not 403.
      operationId: getVehicle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The vehicle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

    patch:
      tags: [Vehicles]
      summary: Update a vehicle
      description: |
        Updates only the fields supplied. Omitted fields are left alone.

        A vehicle cannot be moved between shops through this endpoint —
        `shop_id` is not an accepted field and is rejected as unknown.
        Relocating a vehicle is a separate deliberate operation.
      operationId: updateVehicle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiclePatch' }
            example:
              mileage: "120000"
              plate: KM-4821
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer rl_live_…`

        Issued by a Redlined1 operator with an explicit scope list. The secret
        is shown once at creation and stored only as a hash — it cannot be
        recovered, only replaced.

        Scopes: `customers:read`, `customers:write`, `vehicles:read`,
        `vehicles:write`.

  schemas:
    Customer:
      type: object
      properties:
        id: { type: string, example: C-1734567890123 }
        name: { type: string }
        type: { type: string, enum: [Individual, Business] }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        tags: { type: array, items: { type: string } }
        follow_up: { type: string }
        archived: { type: boolean }
      required: [id, name, type, phone, email, address, tags, follow_up, archived]

    CustomerCreate:
      type: object
      additionalProperties: false
      description: Unknown fields are rejected rather than ignored.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [Individual, Business], default: Individual }
        phone: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
        followUp: { type: string, maxLength: 500 }
      required: [name]

    Vehicle:
      type: object
      description: |
        Service-record fields — issues, damage at intake, parts needed,
        technician pay entries, flat rate, assigned technician — are
        deliberately not exposed. They are the workshop's internal notes and
        its labour cost.
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        vin: { type: string, description: Trimmed and upper-cased. May be empty. Not unique. }
        plate: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        fuel_type: { type: string }
        trim: { type: string }
        engine: { type: string }
        transmission: { type: string }
        mileage: { type: string }
        status: { type: string, example: Active }
        customer_id: { type: string, nullable: true }
      required: [id, label, vin, plate, status, customer_id]

    VehicleCreate:
      type: object
      additionalProperties: false
      description: Unknown fields are rejected rather than ignored.
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        customerId: { type: string, maxLength: 100, nullable: true }
        vin: { type: string, maxLength: 32 }
        plate: { type: string, maxLength: 30 }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: string, maxLength: 10 }
        fuelType: { type: string, maxLength: 30 }
        trim: { type: string, maxLength: 60 }
        engine: { type: string, maxLength: 60 }
        transmission: { type: string, maxLength: 60 }
        mileage: { type: string, maxLength: 20 }
        status: { type: string, maxLength: 40 }
        recommendation: { type: string, maxLength: 1000 }
      required: [label]

    VehiclePatch:
      type: object
      additionalProperties: false
      description: |
        Every field optional; omitted fields are left alone. `shop_id` is not
        accepted — a vehicle cannot change shop through this endpoint.
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        customerId: { type: string, maxLength: 100, nullable: true }
        vin: { type: string, maxLength: 32 }
        plate: { type: string, maxLength: 30 }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: string, maxLength: 10 }
        fuelType: { type: string, maxLength: 30 }
        trim: { type: string, maxLength: 60 }
        engine: { type: string, maxLength: 60 }
        transmission: { type: string, maxLength: 60 }
        mileage: { type: string, maxLength: 20 }
        status: { type: string, maxLength: 40 }
        recommendation: { type: string, maxLength: 1000 }

    Meta:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        idempotent_replay: { type: boolean }

    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            has_more: { type: boolean }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
            details: { type: object, additionalProperties: true }
          required: [code, message, request_id]

  responses:
    Unauthorized:
      description: AUTH_REQUIRED, INVALID_API_KEY or API_KEY_REVOKED.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: FORBIDDEN, SCOPE_REQUIRED or SHOP_NOT_ACCESSIBLE.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: NOT_FOUND. Also returned for a resource owned by another tenant.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: CONFLICT or IDEMPOTENCY_CONFLICT.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: VALIDATION_FAILED, with the offending fields in `details.issues`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: RATE_LIMITED. 120 requests per key per minute.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
