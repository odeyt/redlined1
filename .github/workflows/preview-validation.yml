name: Preview Validation

on:
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same PR
concurrency:
  group: preview-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright Smoke (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets this job mint a short-lived GitHub OIDC token
    # (see the "Get Vercel Trusted-Source OIDC token" step) — Vercel's
    # replacement for the old static VERCEL_AUTOMATION_BYPASS_SECRET, which
    # stopped working because that dashboard feature no longer exists for
    # this project (confirmed 2026-08-30, see issue #15). contents/deployments
    # read are carried over explicitly because setting any `permissions` key
    # switches the token from GitHub's broad default to exactly this list —
    # dropping them would break the deployment-resolution step below.
    permissions:
      contents: read
      deployments: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Resolves the preview URL by querying the GitHub Deployments API
      # directly, rather than trusting a third-party action's first result.
      #
      # Why: this repo has TWO Vercel integrations posting deployment
      # statuses for the same commits — the real one (team
      # "redlined1-s-projects") and a stray legacy one (personal account
      # "d1-imports", predating the team, still connected). Confirmed via
      # the raw API that the SAME deployment id posts two different
      # environment_url values ~29s apart, one per scope, under the SAME
      # environment name — so no action input (environment name, "latest
      # deployment", etc.) can disambiguate them; only filtering the URL
      # string itself can. patrickedqvist/wait-for-vercel-preview has no
      # such filter (verified against its actual v1.3.3 action.yml), so it
      # was replaced here rather than reconfigured.
      #
      # d1-imports's integration should eventually be disconnected at the
      # source (needs whichever separate Vercel login owns it, unknown at
      # commit time) — this filter is the resilient-in-the-meantime fix,
      # not a replacement for that.
      # Narrowed twice, deliberately: filters by BOTH the exact "Preview –
      # redlined1" environment name (this repo also has a second, legitimate
      # project — "d1-redline" — auto-deploying from every push, which isn't
      # authorized as a Trusted Source; picking its URL would still be
      # blocked even with a valid OIDC token) AND the environment_url
      # containing "redlined1-s-projects" (excludes the stray d1-imports
      # legacy integration, which posts under this SAME environment name —
      # confirmed via the raw API, see docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md).
      # Only the "redlined1" project is configured as a Trusted Source today.
      # 2026-09-09: accepts EITHER scope, preferring the team one.
      #
      # On 2026-09-09 the team-scoped integration stopped posting a status
      # altogether. PR #26 that morning carried both URLs; PR #27 hours later
      # carried only d1-imports. So this step timed out with no test run at
      # all, and every PR after it would have done the same — the smoke gate
      # was failing open-ended rather than reporting on the code.
      #
      # Preference order, not equivalence. The team scope is still the only
      # project configured as a Vercel Trusted Source, so its URL is the one
      # known to pass deployment protection; d1-imports is the stray legacy
      # integration this filter was written to exclude and is accepted only
      # when nothing else showed up. Treating them as interchangeable would
      # silently start smoking a different deployment.
      #
      # The fallback is deliberately LOUD: a ::warning:: annotation on the run,
      # because falling back means the primary integration is not posting and
      # that is worth fixing at the source rather than living with. A silent
      # fallback would make this look solved while the real integration stayed
      # broken indefinitely.
      - name: Resolve Vercel Preview URL (redlined1 project, team scope preferred)
        id: vercel_preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          # Attempts before a non-team URL is allowed. The team integration
          # posted ~29s after the other one when both were healthy, so this
          # waits far longer than that before settling for the fallback.
          PREFERRED_ONLY_ATTEMPTS=14

          collect_urls() {
            DEPLOYMENT_IDS=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" \
              --jq '.[] | select(.environment == "Preview – redlined1") | .id')
            for id in $DEPLOYMENT_IDS; do
              gh api "repos/${REPO}/deployments/${id}/statuses?per_page=100" \
                --jq '.[] | select(.state=="success") | .environment_url | select(. != null)'
            done
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            ALL_URLS=$(collect_urls)

            PREFERRED=$(printf '%s\n' "$ALL_URLS" | grep 'redlined1-s-projects' | head -n 1 || true)
            if [ -n "$PREFERRED" ]; then
              echo "Resolved redlined1 preview URL (team scope): $PREFERRED"
              echo "url=$PREFERRED" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -gt "$PREFERRED_ONLY_ATTEMPTS" ]; then
              FALLBACK=$(printf '%s\n' "$ALL_URLS" | grep 'd1-imports' | head -n 1 || true)
              if [ -n "$FALLBACK" ]; then
                echo "::warning::No redlined1-s-projects-scoped preview appeared for ${SHA}; falling back to the d1-imports-scoped deployment (${FALLBACK}). The team-scoped Vercel integration is not posting a deployment status — fix that at the source; this fallback is not a substitute. See docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md"
                echo "Resolved redlined1 preview URL (fallback scope): $FALLBACK"
                echo "url=$FALLBACK" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: no usable 'Preview – redlined1' deployment ready yet, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::Timed out waiting for a 'Preview – redlined1' deployment for ${SHA} in either the redlined1-s-projects or d1-imports scope"
          exit 1

      # Vercel replaced the static "Protection Bypass for Automation" secret
      # with OIDC-based Trusted Sources — confirmed 2026-08-30 by checking
      # the redlined1 project's Deployment Protection settings directly: that
      # section no longer exists there, only "Trusted Sources" (external
      # services present a short-lived OIDC token instead of a shared
      # secret). See docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md and
      # issue #15 for the full history of the old approach failing.
      #
      # This mints a token GitHub's own OIDC provider signs for this exact
      # workflow run, requested with the default audience
      # (https://github.com/<org>) that Vercel's guided "Add GitHub Actions"
      # form configures automatically.
      - name: Get Vercel Trusted-Source OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      # Tests the exact header Playwright is about to send, before spending
      # 8 minutes installing browsers and running the suite. If this repo
      # isn't authorized as a Trusted Source yet, this fails in seconds with
      # a message that says exactly what to configure, instead of a
      # misleading pwa.spec.ts failure that looks like an app bug.
      - name: Verify the OIDC trusted-source bypass actually works
        env:
          URL: ${{ steps.vercel_preview.outputs.url }}
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-vercel-trusted-oidc-idp-token: ${TOKEN}" \
            "${URL}/manifest.json")
          if [ "$STATUS" != "200" ]; then
            echo "::error::OIDC trusted-source token did not get past Vercel's deployment protection for ${URL} (got HTTP ${STATUS} on /manifest.json, expected 200). Configure this repo as a Trusted Source: Vercel dashboard -> redlined1 project -> Settings -> Deployment Protection -> Trusted Sources -> External Services -> Add -> GitHub Actions -> pick this GitHub account (optionally scope to this repo/branch) -> check 'Preview' under Applies to environments -> Add. See docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md and issue #15 for full history."
            exit 1
          fi
          echo "Trusted Source OIDC bypass verified — /manifest.json returned 200 through the protection wall."

      - name: Run public smoke tests against Preview
        run: npx playwright test --project=smoke-chromium
        env:
          TEST_MODE: preview
          VERCEL_PREVIEW_URL: ${{ steps.vercel_preview.outputs.url }}
          # Playwright's own browser requests hit the same protection wall —
          # the verify step above proves the token for the readiness check,
          # this makes playwright.config.ts send the same token for the
          # actual test run.
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview-${{ github.run_number }}
          path: tests/reports/
          retention-days: 14

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ github.run_number }}
          path: tests/screenshots/
          retention-days: 7
