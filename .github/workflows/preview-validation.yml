name: Preview Validation

on:
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same PR
concurrency:
  group: preview-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright Smoke (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Resolves the preview URL by querying the GitHub Deployments API
      # directly, rather than trusting a third-party action's first result.
      #
      # Why: this repo has TWO Vercel integrations posting deployment
      # statuses for the same commits — the real one (team
      # "redlined1-s-projects") and a stray legacy one (personal account
      # "d1-imports", predating the team, still connected). Confirmed via
      # the raw API that the SAME deployment id posts two different
      # environment_url values ~29s apart, one per scope, under the SAME
      # environment name — so no action input (environment name, "latest
      # deployment", etc.) can disambiguate them; only filtering the URL
      # string itself can. patrickedqvist/wait-for-vercel-preview has no
      # such filter (verified against its actual v1.3.3 action.yml), so it
      # was replaced here rather than reconfigured.
      #
      # d1-imports's integration should eventually be disconnected at the
      # source (needs whichever separate Vercel login owns it, unknown at
      # commit time) — this filter is the resilient-in-the-meantime fix,
      # not a replacement for that.
      # Narrowed twice, deliberately: filters by BOTH the exact "Preview –
      # redlined1" environment name (this repo also has a second, legitimate
      # project — "d1-redline" — auto-deploying from every push, whose
      # bypass secret isn't configured; picking its URL would 401 even with
      # a valid VERCEL_AUTOMATION_BYPASS_SECRET) AND the environment_url
      # containing "redlined1-s-projects" (excludes the stray d1-imports
      # legacy integration, which posts under this SAME environment name —
      # confirmed via the raw API, see docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md).
      # Only the "redlined1" project has a bypass secret provisioned today.
      - name: Resolve Vercel Preview URL (redlined1 project, redlined1-s-projects scope only)
        id: vercel_preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            URL=""
            DEPLOYMENT_IDS=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" \
              --jq '.[] | select(.environment == "Preview – redlined1") | .id')
            for id in $DEPLOYMENT_IDS; do
              MATCH=$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=100" \
                --jq '.[] | select(.state=="success") | select(.environment_url | contains("redlined1-s-projects")) | .environment_url' \
                | head -n 1)
              if [ -n "$MATCH" ]; then
                URL="$MATCH"
                break
              fi
            done
            if [ -n "$URL" ]; then
              echo "Resolved redlined1 project preview URL: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: no matching redlined1 preview deployment ready yet, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::Timed out waiting for a redlined1-s-projects-scoped 'Preview – redlined1' deployment for ${SHA}"
          exit 1

      # Every run of this workflow so far has failed deep inside Playwright,
      # 8+ minutes in, with signatures (Vercel's own SSO login page, 302s on
      # /manifest.json and /sw.js) that all trace back to one cause: the
      # bypass header not actually getting the request past Vercel's
      # deployment-protection wall. The URL resolution above was confirmed
      # correct (it does resolve a redlined1-s-projects-scoped URL — see
      # docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md and issue #15),
      # so a still-failing bypass points at the secret value itself: either
      # never matching what Vercel issued, or stale after a rotation.
      #
      # This step tests the exact header Playwright is about to send, before
      # spending 8 minutes installing browsers and running the suite. If the
      # secret is wrong, this fails in seconds with a message that says
      # exactly what to fix, instead of a misleading pwa.spec.ts failure that
      # looks like an app bug.
      - name: Verify the protection bypass actually works
        env:
          URL: ${{ steps.vercel_preview.outputs.url }}
          SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set — Preview is behind Vercel's deployment protection and no request will get through. Vercel dashboard → redlined1 project → Settings → Deployment Protection → Protection Bypass for Automation → generate one, then: gh secret set VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-vercel-protection-bypass: ${SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "${URL}/manifest.json")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Bypass header did not get past Vercel's deployment protection for ${URL} (got HTTP ${STATUS} on /manifest.json, expected 200). The VERCEL_AUTOMATION_BYPASS_SECRET value no longer matches this project. Fix: Vercel dashboard -> redlined1 project -> Settings -> Deployment Protection -> Protection Bypass for Automation -> regenerate, then run: gh secret set VERCEL_AUTOMATION_BYPASS_SECRET --repo odeyt/redlined1 (paste the new value). See docs/deployment/VERCEL_PREVIEW_PROTECTION_BYPASS.md and issue #15 for full history."
            exit 1
          fi
          echo "Bypass verified — /manifest.json returned 200 through the protection wall."

      - name: Run public smoke tests against Preview
        run: npx playwright test --project=smoke-chromium
        env:
          TEST_MODE: preview
          VERCEL_PREVIEW_URL: ${{ steps.vercel_preview.outputs.url }}
          # Playwright's own browser requests hit the same protection wall —
          # the wait step bypasses it just for the readiness check, this
          # makes playwright.config.ts do the same for the actual test run.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview-${{ github.run_number }}
          path: tests/reports/
          retention-days: 14

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ github.run_number }}
          path: tests/screenshots/
          retention-days: 7
