name: Support triage migration validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/2026-08-03_support_tickets.sql'
      - 'supabase/migrations/2026-09-19_support_ticket_triage.sql'
      - '.github/workflows/support-triage-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated prerequisite schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          -- A real Supabase project grants EVERY new public table and sequence to these roles with ALL
          -- privileges by default. Without this the stand-in is too clean and cannot catch a migration that
          -- forgets to take a default back (which is exactly the bug this step exists to catch).
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $f$ SELECT '11111111-1111-1111-1111-111111111111'::uuid $f$;
          CREATE TABLE public.shops (id uuid PRIMARY KEY);
          CREATE TABLE public.shop_users (shop_id uuid NOT NULL REFERENCES public.shops(id), user_id uuid NOT NULL);
          GRANT USAGE ON SCHEMA public, auth TO anon, authenticated, service_role;
          GRANT SELECT ON public.shops, public.shop_users TO authenticated;
          INSERT INTO public.shops VALUES ('22222222-2222-2222-2222-222222222222');
          INSERT INTO public.shop_users VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111');
          SQL
      - name: Apply original support schema and seed a ticket
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-08-03_support_tickets.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.support_tickets (id, shop_id, created_by, subject)
          VALUES ('33333333-3333-3333-3333-333333333333', '22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'existing ticket');
          CREATE TABLE public.test_ticket_snapshot AS SELECT * FROM public.support_tickets;
          SQL
      - name: Apply new migration twice and verify privileges and data
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-09-19_support_ticket_triage.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-09-19_support_ticket_triage.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.support_ticket_triage_events'::regclass)
               OR EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = 'public.support_ticket_triage_events'::regclass)
               OR has_table_privilege('anon', 'public.support_ticket_triage_events', 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
               OR has_table_privilege('authenticated', 'public.support_ticket_triage_events', 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
               OR NOT has_table_privilege('service_role', 'public.support_ticket_triage_events', 'SELECT')
               OR NOT has_table_privilege('service_role', 'public.support_ticket_triage_events', 'INSERT')
               OR has_table_privilege('service_role', 'public.support_ticket_triage_events', 'UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
               OR has_sequence_privilege('anon', 'public.support_ticket_triage_events_id_seq', 'USAGE,SELECT,UPDATE')
               OR has_sequence_privilege('authenticated', 'public.support_ticket_triage_events_id_seq', 'USAGE,SELECT,UPDATE')
               OR has_sequence_privilege('service_role', 'public.support_ticket_triage_events_id_seq', 'USAGE,SELECT,UPDATE')
            THEN RAISE EXCEPTION 'triage access assertions failed'; END IF;
            IF (SELECT count(*) FROM public.support_tickets) <> 1
               OR EXISTS (SELECT * FROM public.support_tickets EXCEPT SELECT * FROM public.test_ticket_snapshot)
               OR EXISTS (SELECT * FROM public.test_ticket_snapshot EXCEPT SELECT * FROM public.support_tickets)
            THEN RAISE EXCEPTION 'existing ticket changed'; END IF;
          END $$;
          SET ROLE service_role;
          INSERT INTO public.support_ticket_triage_events(ticket_id, triage, set_by)
          VALUES ('33333333-3333-3333-3333-333333333333', 'real', 'test-owner@example.test');
          INSERT INTO public.support_ticket_triage_events(ticket_id, triage, set_by)
          VALUES ('33333333-3333-3333-3333-333333333333', 'unreviewed', 'test-owner@example.test');
          RESET ROLE;
          DO $$
          BEGIN
            IF (SELECT triage FROM public.support_ticket_triage_events ORDER BY id DESC LIMIT 1) <> 'unreviewed'
            THEN RAISE EXCEPTION 'append-only clearing failed'; END IF;
          END $$;
          SQL
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT * FROM public.support_ticket_triage_events" >/dev/null 2>&1; then
            echo "authenticated role unexpectedly read triage events"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; INSERT INTO public.support_ticket_triage_events(ticket_id,triage,set_by) VALUES ('33333333-3333-3333-3333-333333333333','spam','customer')" >/dev/null 2>&1; then
            echo "authenticated role unexpectedly wrote triage events"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE service_role; UPDATE public.support_ticket_triage_events SET triage='spam'" >/dev/null 2>&1; then
            echo "service role unexpectedly updated triage history"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE service_role; DELETE FROM public.support_ticket_triage_events" >/dev/null 2>&1; then
            echo "service role unexpectedly deleted triage history"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE service_role; TRUNCATE public.support_ticket_triage_events" >/dev/null 2>&1; then
            echo "service role unexpectedly truncated triage history"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT * FROM public.support_ticket_triage_events" >/dev/null 2>&1; then
            echo "anon role unexpectedly read triage events"; exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT nextval('public.support_ticket_triage_events_id_seq')" >/dev/null 2>&1; then
            echo "authenticated role unexpectedly used the marker id sequence"; exit 1
          fi
      - name: Verify the marker history survives deletion of its ticket
        run: |
          # Runs as the table owner (postgres), which grants alone do not bind: the append-only trigger must.
          # Each statement must be refused BY THE TRIGGER; the error text is checked so an unrelated failure
          # (a typo, a missing table) cannot make this pass vacuously.
          refuse() {
            if err=$(psql -v ON_ERROR_STOP=1 -c "$1" 2>&1 >/dev/null); then
              echo "NOT REFUSED: $1"; exit 1
            fi
            echo "$err" | grep -q "append-only" || { echo "refused, but not by the append-only trigger: $1 -> $err"; exit 1; }
          }
          refuse "DELETE FROM public.support_tickets WHERE id = '33333333-3333-3333-3333-333333333333'"
          refuse "DELETE FROM public.support_ticket_triage_events"
          refuse "UPDATE public.support_ticket_triage_events SET triage = 'spam'"
          refuse "TRUNCATE public.support_ticket_triage_events"
          refuse "TRUNCATE public.support_tickets CASCADE"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.support_ticket_triage_events) <> 2
               OR (SELECT count(*) FROM public.support_tickets) <> 1
            THEN RAISE EXCEPTION 'a refused delete still removed a ticket or a marking'; END IF;
          END $$;
          SQL
          # The one exemption: a synthetic-shop purge sets this transaction-local flag. The cascade then works.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SELECT set_config('redlined1.purging_synthetic_shop', 'on', true);
          DELETE FROM public.support_tickets WHERE id = '33333333-3333-3333-3333-333333333333';
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.support_ticket_triage_events) <> 0
            THEN RAISE EXCEPTION 'a flagged purge did not cascade to the markings'; END IF;
          END $$;
          ROLLBACK;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.support_ticket_triage_events) <> 2
               OR (SELECT count(*) FROM public.support_tickets) <> 1
            THEN RAISE EXCEPTION 'the rolled-back purge changed data'; END IF;
          END $$;
          SQL
      - name: Verify the documented rollback never discards audit rows
        run: |
          # The table holds 2 markings here. The documented guarded drop must refuse and leave everything in place.
          if psql -v ON_ERROR_STOP=1 <<'SQL' >/dev/null 2>&1
          BEGIN;
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM public.support_ticket_triage_events) THEN
              RAISE EXCEPTION 'support_ticket_triage_events holds audit rows: keep or archive it, do not drop it';
            END IF;
          END $$;
          DROP TABLE public.support_ticket_triage_events;
          COMMIT;
          SQL
          then echo "guarded rollback dropped a table that holds audit rows"; exit 1; fi
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.support_ticket_triage_events') IS NULL
               OR (SELECT count(*) FROM public.support_ticket_triage_events) <> 2
            THEN RAISE EXCEPTION 'refused drop still lost the table or its rows'; END IF;
          END $$;
          -- Archive path: rename keeps every row and the lock-down.
          ALTER TABLE public.support_ticket_triage_events RENAME TO support_ticket_triage_events_archive;
          ALTER INDEX public.support_ticket_triage_events_ticket_idx RENAME TO support_ticket_triage_events_archive_ticket_idx;
          DO $$
          DECLARE t CONSTANT text := 'public.support_ticket_triage_events_archive';
          BEGIN
            IF to_regclass('public.support_ticket_triage_events') IS NOT NULL
               OR (SELECT count(*) FROM public.support_ticket_triage_events_archive) <> 2
               OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid = t::regclass)
               OR has_table_privilege('anon', t, 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE')
               OR has_table_privilege('authenticated', t, 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE')
               OR has_table_privilege('service_role', t, 'UPDATE,DELETE,TRUNCATE')
               OR (SELECT count(*) FROM public.support_tickets) <> 1
               OR EXISTS (SELECT * FROM public.support_tickets EXCEPT SELECT * FROM public.test_ticket_snapshot)
            THEN RAISE EXCEPTION 'archive rollback lost rows, kept a grant it should not, or changed a ticket'; END IF;
          END $$;
          SQL
          # Empty-table case: re-apply the migration (a fresh empty table), and the guarded drop succeeds.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/2026-09-19_support_ticket_triage.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM public.support_ticket_triage_events) THEN
              RAISE EXCEPTION 'support_ticket_triage_events holds audit rows: keep or archive it, do not drop it';
            END IF;
          END $$;
          DROP TABLE public.support_ticket_triage_events;
          COMMIT;
          DO $$
          BEGIN
            IF to_regclass('public.support_ticket_triage_events') IS NOT NULL
               OR (SELECT count(*) FROM public.support_ticket_triage_events_archive) <> 2
               OR (SELECT count(*) FROM public.support_tickets) <> 1
            THEN RAISE EXCEPTION 'empty-table rollback failed or touched the archive'; END IF;
          END $$;
          SQL
